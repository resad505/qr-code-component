<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="qr-code.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Young+Serif&display=swap"
    rel="stylesheet">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="row">
      <div class="image-qr-code">
        <img src="./images/image-qr-code.png" alt="QR Code">
      </div>
    </header>
    <section class="header-text">
      <h3>Improve your front-end skills<br> by building projects</h3>
    </section>
    <section>
      <p class="paragraph">Scan the QR code to visit Frontend<br> Mentor and take your coding skills to<br> the next
        level</p>
    </section>
    <footer>
      <div class="attribution">
        <p class="challenge">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend
            Mentor</a>.</p>
        <br>
        <p class="coded-by">Coded by <a href="#">Reshad Mammedov</a>.</p>
      </div>
    </footer>
  </main>
</body>


</html>
